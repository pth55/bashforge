services:

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options: {max-size: "20m", max-file: "3"}

  # ── Backend ────────────────────────────────────────────────────────
  backend:
    image: REGISTRY_PLACEHOLDER/bashforge-backend:latest
    restart: unless-stopped
    env_file: /opt/bashforge/.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ── Frontend ───────────────────────────────────────────────────────
  frontend:
    image: REGISTRY_PLACEHOLDER/bashforge-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options: {max-size: "20m", max-file: "3"}

networks:
  default:
    name: bashforge-prod
