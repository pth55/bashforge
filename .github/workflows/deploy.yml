name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPO_PREFIX: bashforge

jobs:
  # ── 1. Build and push all images to ECR ──────────────────────────
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_PREFIX-frontend:$TAG" ./frontend
          docker tag  "$REGISTRY/$ECR_REPO_PREFIX-frontend:$TAG" \
                      "$REGISTRY/$ECR_REPO_PREFIX-frontend:latest"
          docker push "$REGISTRY/$ECR_REPO_PREFIX-frontend:$TAG"
          docker push "$REGISTRY/$ECR_REPO_PREFIX-frontend:latest"

      - name: Build & push backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_PREFIX-backend:$TAG" ./backend
          docker tag  "$REGISTRY/$ECR_REPO_PREFIX-backend:$TAG" \
                      "$REGISTRY/$ECR_REPO_PREFIX-backend:latest"
          docker push "$REGISTRY/$ECR_REPO_PREFIX-backend:$TAG"
          docker push "$REGISTRY/$ECR_REPO_PREFIX-backend:latest"

      - name: Build & push sandbox
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_PREFIX-sandbox:$TAG" ./sandbox
          docker tag  "$REGISTRY/$ECR_REPO_PREFIX-sandbox:$TAG" \
                      "$REGISTRY/$ECR_REPO_PREFIX-sandbox:latest"
          docker push "$REGISTRY/$ECR_REPO_PREFIX-sandbox:$TAG"
          docker push "$REGISTRY/$ECR_REPO_PREFIX-sandbox:latest"

  # ── 2. Register new ECS task definition revision ──────────────────
  update-ecs-task:
    name: Update ECS Task Definition
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new sandbox task definition revision
        env:
          REGISTRY: ${{ needs.build-push.outputs.ecr_registry }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          set -euo pipefail
          # Fetch current task definition, update image tag, register new revision
          CURRENT=$(aws ecs describe-task-definition \
            --task-definition bashforge-sandbox \
            --query 'taskDefinition' --output json)

          NEW_IMAGE="$REGISTRY/$ECR_REPO_PREFIX-sandbox:$TAG"

          # Replace container image in definition
          NEW_DEF=$(echo "$CURRENT" | jq \
            --arg img "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $img |
             del(.taskDefinitionArn, .revision, .status,
                 .requiresAttributes, .compatibilities,
                 .registeredAt, .registeredBy)')

          aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF"

          echo "New task definition revision registered with image: $NEW_IMAGE"

  # ── 3. Deploy frontend + backend to App EC2 ──────────────────────
  deploy-app:
    name: Deploy App EC2
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy to App EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_APP_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_APP_SSH_KEY }}
          timeout: 120s
          script: |
            set -euo pipefail
            REGION="${{ env.AWS_REGION }}"
            REGISTRY="${{ needs.build-push.outputs.ecr_registry }}"
            TAG="${{ needs.build-push.outputs.tag }}"
            PREFIX="${{ env.ECR_REPO_PREFIX }}"

            echo "=== Login to ECR ==="
            aws ecr get-login-password --region "$REGION" | \
                docker login --username AWS --password-stdin "$REGISTRY"

            echo "=== Pulling new images ==="
            docker pull "$REGISTRY/${PREFIX}-frontend:$TAG"
            docker pull "$REGISTRY/${PREFIX}-backend:$TAG"

            echo "=== Updating image tags in docker-compose.prod.yml ==="
            cd /opt/bashforge
            sed -i "s|${REGISTRY}/${PREFIX}-frontend:.*|${REGISTRY}/${PREFIX}-frontend:${TAG}|g" \
                docker-compose.prod.yml
            sed -i "s|${REGISTRY}/${PREFIX}-backend:.*|${REGISTRY}/${PREFIX}-backend:${TAG}|g" \
                docker-compose.prod.yml

            echo "=== Rolling deploy ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans frontend backend

            echo "=== Health check ==="
            sleep 5
            curl -sf http://localhost:8000/api/health && echo "Backend: OK" || echo "Backend: FAIL"
            curl -sf http://localhost:8080/           && echo "Frontend: OK" || echo "Frontend: FAIL"

            echo "=== Pruning old images ==="
            docker image prune -f --filter "until=24h"
